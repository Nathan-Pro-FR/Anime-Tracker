<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Anime Tracker V2</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🎌 Anime Tracker</h1>

<input id="searchInput" placeholder="Rechercher un anime...">
<button onclick="searchAnime()">🔍</button>
</header>

<!-- NAV -->
<nav class="tabs">
<button onclick="switchTab('search')">🔍 Recherche</button>
<button onclick="switchTab('library')">📚 Ma Liste</button>
<button onclick="switchTab('stats')">📊 Stats</button>
</nav>

<!-- SEARCH -->
<section id="search" class="tab active">
<div id="results"></div>
</section>

<!-- LIBRARY -->
<section id="library" class="tab">
<div id="animeList"></div>

<div class="actions">
<button onclick="exportJSON()">Exporter JSON</button>
<button onclick="exportCSV()">Exporter CSV</button>

<input type="file" id="importFile" accept=".json,.csv">
</div>
</section>

<!-- STATS -->
<section id="stats" class="tab">
<div class="dashboard">

<div class="cardStat">
<h2 id="total">0</h2>
<p>Total</p>
</div>

<div class="cardStat">
<h2 id="watching">0</h2>
<p>En cours</p>
</div>

<div class="cardStat">
<h2 id="completed">0</h2>
<p>Terminés</p>
</div>

<div class="cardStat">
<h2 id="avg">0</h2>
<p>Moyenne ⭐</p>
</div>

</div>
</section>

<script src="script.js"></script>
</body>
</html>
